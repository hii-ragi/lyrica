name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_models:
        description: 'Download real models and run Demucs + WhisperX smoke test'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -e ./backend -r backend/requirements-test.txt
      - run: python -m unittest discover -s backend/tests -v
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:ui
      - if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-failure
          path: test-results/
          retention-days: 7
  build-windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_backend.py --target x86_64-pc-windows-msvc
      - run: python scripts/smoke_backend.py src-tauri/binaries/lyrica-backend-x86_64-pc-windows-msvc.exe
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --ci -- --locked
      - uses: actions/upload-artifact@v6
        with:
          name: lyrica-windows-x64-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
  analysis-smoke:
    name: Real Demucs + WhisperX models (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.real_models
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_backend.py --target x86_64-pc-windows-msvc
      - run: python scripts/manage_analysis.py setup
      - run: ./scripts/create_smoke_audio.ps1
      - run: python scripts/smoke_analysis.py --audio build/smoke-en.wav --lyrics build/smoke-en.txt --language en --separate --engine whisperx
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-analysis-result
          path: build/smoke-analysis-result.json
          retention-days: 7
