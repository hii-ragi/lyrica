[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrica-backend"
version = "1.0.0"
description = "Lyrica desktop backend and LRC exporter"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lyrica-backend = "lyrica_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
